<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
        <title>Pizza on Wheels - Recipe Box</title>
    </head>
    <body>
        <header>

        </header>
        <main class="container py-5">
            <section id="find-a-recipe">
                <h2>
                    Find a recipe:
                </h2>
                <input id="recipe-id" type="number" placeholder="Recipie id number">
                <button id="get-btn" class="btn btn-dark">GET</button>
                <p id="status">
                </p>
                <div id="recipe">
                </div>
            </section>
            <section id="add-a-dish">
                <h2>
                    Add a dish:
                </h2>
                <input id="dish-name" type="text" placeholder="New dish name">
                <button id="post-btn" class="btn btn-info">POST</button>
                <p id="post-status">
                </p>
                <div id="saved">
                </div>
            </section>
        </main>
        <footer>

        </footer>
        <script src="./script.js"></script>
    </body>
</html>
